name: Deploy do cliente (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build do cliente
        run: npm run build -w client
        env:
          # Settings → Secrets and variables → Actions → Variables
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Avisar se o servidor não foi configurado
        if: ${{ vars.VITE_SERVER_URL == '' }}
        run: echo "::warning::VITE_SERVER_URL não está definida. A página vai abrir, mas não vai conectar em nenhum servidor."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
