name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Teste de conexão (2 clientes, desktop + celular)
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-playwright
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
