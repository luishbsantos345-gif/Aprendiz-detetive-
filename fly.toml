# fly launch --copy-config --no-deploy  (troque o nome do app se já estiver em uso)
app = "aprendiz-detetive"
primary_region = "gru" # São Paulo

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
